<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Yogurt Clicker 3D - Firebase Cloud</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            background-position: center center;
            background-repeat: repeat-x;
            background-size: auto 120%;
            height: 100vh;
            width: 100vw;
            transition: background-image 0.5s ease-in-out;
        }
        #game-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
        .pointer-events-auto { pointer-events: auto; }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .animate-float { animation: float 3s ease-in-out infinite; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .tab-btn.active { background-color: #db2777; color: white; border-color: #fce7f3; }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

<div id="loading-screen" class="fixed inset-0 z-50 flex items-center justify-center bg-black text-white flex-col transition-opacity duration-1000">
    <img src="https://ltdfoto.ru/images/2026/02/04/28403.png" alt="Logo" class="w-64 mb-6 animate-float object-contain">
    <div class="w-64 h-2 bg-gray-800 rounded-full overflow-hidden">
        <div id="loading-bar" class="h-full bg-pink-500 w-0 transition-all duration-[2000ms] ease-out"></div>
    </div>
    <p class="mt-4 text-gray-400 text-sm" id="loading-text">Загрузка Firebase...</p>
</div>

<canvas id="game-canvas"></canvas>

<div id="ui-layer" class="flex flex-col justify-between p-4">
    <div class="flex flex-col gap-2 pointer-events-auto">
        <div class="flex gap-3 items-center bg-black/50 p-2 rounded-lg backdrop-blur-sm w-fit flex-wrap">
            <div class="flex items-center gap-1"><span class="text-xl">💰</span> <span id="money-display" class="font-mono text-lg text-white font-bold">0</span></div>
            <div class="flex items-center gap-1"><span class="text-lg">💎</span> <span id="gems-display" class="font-mono text-base text-cyan-300 font-bold">0</span></div>
            <div class="flex items-center gap-1"><span class="text-lg">⭐</span> <span id="stars-display" class="font-mono text-base text-yellow-400 font-bold">0</span></div>
        </div>
        <div class="bg-black/40 p-1 px-3 rounded-lg backdrop-blur-sm w-fit text-xs text-gray-300">
            Перерождения: <span id="rebirth-display" class="text-white font-bold">0</span> (x<span id="multiplier-display">1.0</span>)
        </div>
    </div>
    <div class="absolute top-4 right-4 bg-black/50 p-2 rounded-full w-16 h-16 flex items-center justify-center backdrop-blur-sm border-2 border-pink-400/30">
        <span id="progress-display" class="text-2xl font-bold text-white">0/10</span>
    </div>
</div>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // --- FIREBASE SETUP ---
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, get, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyC-ZGtHHteBNR-BSeRID4zxCcUB7jMYz6g",
        authDomain: "yougurt-46e56.firebaseapp.com",
        projectId: "yougurt-46e56",
        storageBucket: "yougurt-46e56.firebasestorage.app",
        messagingSenderId: "704279353180",
        appId: "1:704279353180:web:defaf521dd35318398d399",
        measurementId: "G-4PXKPZPE6P"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const SAVE_KEY = 'peniGameS_universal_save';
    const userId = "player_1"; // В будущем заменить на Auth ID

    // --- GAME LOGIC ---
    class Game {
        constructor() {
            this.state = {
                money: 0, gems: 0, stars: 0, rebirths: 0,
                currentProgress: 0, unlockedSkins: ['default'],
                equippedSkin: 'default', optimized: true
            };

            this.ui = {
                money: document.getElementById('money-display'),
                gems: document.getElementById('gems-display'),
                stars: document.getElementById('stars-display'),
                rebirth: document.getElementById('rebirth-display'),
                multiplier: document.getElementById('multiplier-display'),
                progress: document.getElementById('progress-display'),
                loadingBar: document.getElementById('loading-bar'),
                loadingScreen: document.getElementById('loading-screen')
            };

            this.init();
        }

        async init() {
            await this.loadFromCloud();
            this.updateUI();
            this.hideLoading();
            this.startAutoSave();
        }

        async save() {
            // Сохраняем локально для быстроты
            localStorage.setItem(SAVE_KEY, JSON.stringify(this.state));
            // Отправляем в Firebase
            try {
                await set(ref(db, 'users/' + userId), this.state);
            } catch (e) { console.error("Firebase Save Error", e); }
        }

        async loadFromCloud() {
            try {
                const snapshot = await get(ref(db, 'users/' + userId));
                if (snapshot.exists()) {
                    console.log("Data loaded from Firebase");
                    this.state = { ...this.state, ...snapshot.val() };
                } else {
                    // Если в облаке пусто, ищем локально
                    const local = localStorage.getItem(SAVE_KEY);
                    if (local) this.state = JSON.parse(local);
                }
            } catch (e) {
                console.error("Firebase Load Error", e);
            }
        }

        startAutoSave() {
            setInterval(() => this.save(), 30000); // Раз в 30 сек на всякий случай
        }

        click() {
            this.state.currentProgress++;
            if (this.state.currentProgress >= 10) {
                this.state.currentProgress = 0;
                this.state.money += 50 * (1 + this.state.rebirths * 0.05);
                this.save(); // Сохраняем при важном событии
            }
            this.updateUI();
        }

        updateUI() {
            this.ui.money.innerText = Math.floor(this.state.money).toLocaleString();
            this.ui.gems.innerText = this.state.gems;
            this.ui.stars.innerText = this.state.stars;
            this.ui.rebirth.innerText = this.state.rebirths;
            this.ui.progress.innerText = `${this.state.currentProgress}/10`;
            this.ui.multiplier.innerText = (1 + this.state.rebirths * 0.05).toFixed(2);
        }

        hideLoading() {
            this.ui.loadingBar.style.width = "100%";
            setTimeout(() => {
                this.ui.loadingScreen.style.opacity = "0";
                setTimeout(() => this.ui.loadingScreen.remove(), 1000);
            }, 500);
        }
    }

    const game = new Game();
    window.game = game;

    // --- SIMPLE 3D (Для примера, ваш полный Three.js код вставить ниже) ---
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('game-canvas'), alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);

    const geometry = new THREE.CapsuleGeometry(1, 2, 4, 8);
    const material = new THREE.MeshStandardMaterial({ color: 0xff69b4 });
    const yogurt = new THREE.Mesh(geometry, material);
    scene.add(yogurt);

    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(5, 5, 5);
    scene.add(light);
    camera.position.z = 5;

    window.addEventListener('pointerdown', () => {
        game.click();
        yogurt.scale.set(1.1, 0.9, 1.1);
        setTimeout(() => yogurt.scale.set(1, 1, 1), 100);
    });

    function animate() {
        requestAnimationFrame(animate);
        yogurt.rotation.y += 0.01;
        renderer.render(scene, camera);
    }
    animate();
</script>
</body>
</html>
